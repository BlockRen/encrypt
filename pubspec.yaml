repository: https://github.com/leocavalcante/encrypt

executables:
  secure-random:

environment:
  sdk: ^3.6.0

dependencies:
  args: ^2.7.0
  asn1lib: ^1.6.4
  clock: ^1.1.2
  collection: ^1.19.1
  crypto: ^3.0.6
  pointycastle: ^4.0.0

dev_dependencies:
  lints: ^2.0.0
  test: ^1.24.0

false_secrets:
 - /test/*.pem
